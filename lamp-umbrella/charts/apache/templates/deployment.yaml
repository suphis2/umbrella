apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apache.fullname" . }}
  labels:
    app: {{ include "apache.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "apache.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "apache.name" . }}
    spec:
      containers:
        - name: apache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: apache-html
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: apache-html
          configMap:
            name: apache-testpage
