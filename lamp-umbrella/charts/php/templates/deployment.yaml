apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "php.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "php.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "php.name" . }}
    spec:
      containers:
        - name: php
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: php-content
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: php-content
          emptyDir: {}
